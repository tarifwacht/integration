compare:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: tarifwacht
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
import_statistics:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: tarifwacht
    start:
      required: true
      example: "2026-01-01"
      selector:
        date:
    replace:
      default: false
      selector:
        boolean:
backfill_price:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: tarifwacht
    price_entity:
      required: true
      selector:
        entity:
          domain: sensor
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    price:
      required: true
      example: 0.1654
      selector:
        number:
          min: -10
          max: 100
          step: 0.001
          unit_of_measurement: €/kWh
          mode: box
simulate_battery:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: tarifwacht
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    sizes:
      example: ["5", "10", "15"]
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - "2"
            - "5"
            - "7.5"
            - "10"
            - "15"
            - "20"
    advanced:
      collapsed: true
      fields:
        power:
          selector:
            number:
              min: 0.1
              max: 50
              step: 0.1
              unit_of_measurement: kW
              mode: box
        efficiency:
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: box
        grid_charging:
          default: false
          selector:
            boolean:
        grid_power:
          selector:
            number:
              min: 0.1
              max: 50
              step: 0.1
              unit_of_measurement: kW
              mode: box
