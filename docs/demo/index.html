<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tarifwacht – Demo</title>
    <meta
      name="description"
      content="Tarifwacht zum Ausprobieren: Festpreis, dynamischer Tarif und Modul 3 im Vergleich, dazu die Ersparnis durch PV und Speicher – mit erfundenen Preisen, gerechnet vom Code der Integration."
    />
    <link rel="icon" href="../../custom_components/tarifwacht/brand/icon.png" />
    <style>
      /* Page chrome in the Tarifwacht colours (docs/BRAND.md), the dashboard
         with Home Assistant's default theme variables. */
      :root {
        color-scheme: light;
        --page-bg: #faf7f2;
        --page-text: #1f1c18;
        --page-muted: #6b6357;
        --page-line: #e4ddd1;
        --brand: #96497d;
        --accent: #f5a623;
        --control-bg: #ffffff;
        --primary-color: #03a9f4;
        --card-background-color: #ffffff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --secondary-background-color: #f2f2f2;
        --divider-color: rgba(0, 0, 0, 0.12);
        --state-icon-color: #44739e;
        --series-fixed: #44739e;
        --series-dynamic: #ff9800;
        --series-modul3: #43a047;
        --series-pv: #f5a623;
        --series-battery: #00897b;
        --usage: rgba(150, 73, 125, 0.28);
        --error-color: #db4437;
        --success-color: #43a047;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --page-bg: #14181d;
        --page-text: #ece8e1;
        --page-muted: #b9b2a6;
        --page-line: #2a3038;
        --brand: #c983b1;
        --control-bg: #1d232a;
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --secondary-background-color: #282828;
        --divider-color: rgba(225, 225, 225, 0.12);
        --state-icon-color: #6aa7d8;
        --series-fixed: #6aa7d8;
        --series-battery: #26a69a;
        --usage: rgba(201, 131, 177, 0.3);
        --primary-color: #2196f3;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--page-bg); color: var(--page-text);
        font: 15px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .page { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
      header { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; }
      header img { width: 52px; height: 52px; border-radius: 12px; }
      h1 { margin: 0; font-size: 24px; line-height: 1.2; }
      h1 span { color: var(--page-muted); font-weight: 400; }
      .tagline { margin: 2px 0 0; color: var(--page-muted); }
      header a.repo { margin-left: auto; color: var(--brand); text-decoration: none; font-weight: 600;
        white-space: nowrap; }
      .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; margin-bottom: 20px; }
      .group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .group > span { font-size: 12px; color: var(--page-muted); text-transform: uppercase; letter-spacing: .04em; }
      .seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; overflow: hidden;
        border: 1px solid var(--page-line); border-radius: 8px; background: var(--control-bg); }
      .seg button { border: 0; border-right: 1px solid var(--page-line); background: none; color: inherit;
        font: inherit; padding: 6px 12px; cursor: pointer; }
      .seg button:last-child { border-right: 0; }
      .seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
      .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      svg.mdi { width: 1em; height: 1em; fill: currentColor; flex: none; vertical-align: -0.125em; }
      .banner { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; padding: 10px 14px;
        border-radius: 10px; border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
        background: color-mix(in srgb, var(--accent) 14%, var(--page-bg)); font-size: 14px; }
      .banner svg.mdi { font-size: 22px; color: var(--accent); }

      /* Dashboard: Home Assistant's sections view. */
      .sections { display: grid; gap: 24px 16px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
      .section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
      .section.double { grid-column: span 2; }
      .section.wide { grid-column: 1 / -1; }
      @media (max-width: 720px) { .section.double { grid-column: auto; } header a.repo { display: none; } }
      .heading { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 16px;
        font-weight: 500; color: var(--primary-text-color); }
      .heading svg.mdi { font-size: 20px; color: var(--secondary-text-color); }
      .subtitle { font-size: 13px; color: var(--secondary-text-color); padding: 2px 4px; }
      .card { background: var(--card-background-color); color: var(--primary-text-color);
        border: 1px solid var(--divider-color); border-radius: 12px; overflow: hidden; }
      .card-title { padding: 12px 16px 0; font-size: 16px; font-weight: 500; }
      .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; }
      .c12 { grid-column: span 12; } .c6 { grid-column: span 6; } .c4 { grid-column: span 4; }

      /* Tile card */
      .tile { display: flex; gap: 12px; align-items: center; padding: 10px 12px; min-height: 56px; }
      .tile .shape { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
        font-size: 20px; color: var(--brand); background: color-mix(in srgb, var(--brand) 18%, transparent); }
      .tile b { display: block; font-size: 14px; font-weight: 500; }
      .tile small { display: block; font-size: 13px; color: var(--secondary-text-color); }
      /* Statistic card */
      .stat { padding: 12px 14px; }
      .stat .name { font-size: 13px; color: var(--secondary-text-color); }
      .stat .value { font-size: 26px; line-height: 1.25; }
      .stat .value span { font-size: 14px; color: var(--secondary-text-color); margin-left: 2px; }
      .stat .value.more { color: #d32f2f; } .stat .value.less { color: #2e7d32; }
      :root[data-theme="dark"] .stat .value.more { color: #ef6c6c; }
      :root[data-theme="dark"] .stat .value.less { color: #66bb6a; }

      /* Entities card */
      .rows { padding: 4px 0; }
      .row { display: flex; align-items: center; gap: 16px; padding: 7px 16px; font-size: 14px; }
      .row svg.mdi { font-size: 24px; color: var(--state-icon-color); }
      .row .value { margin-left: auto; text-align: right; white-space: nowrap; }
      .row small { display: block; color: var(--secondary-text-color); font-size: 12px; }
      .device { padding: 10px 16px 0; font-size: 13px; color: var(--secondary-text-color); }

      /* Charts */
      svg.chart { display: block; width: 100%; height: auto; }
      svg.chart text { fill: var(--secondary-text-color); font-size: 11px; }
      svg.chart .grid { stroke: var(--divider-color); }
      svg.chart .now { stroke: var(--secondary-text-color); stroke-dasharray: 3 3; }
      .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; padding: 0 12px 10px;
        font-size: 12px; }
      .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
      .footnote { padding: 0 16px 10px; font-size: 12px; color: var(--secondary-text-color); }

      /* Push notification (phone lock screen) */
      .phone { padding: 14px 12px; background: linear-gradient(160deg, #3b2140, #6b3d61 55%, #9a6a8c); }
      .push { background: rgba(255, 255, 255, 0.88); color: #1b1b1b; border-radius: 16px; padding: 9px 12px;
        font-size: 13px; line-height: 1.4; white-space: pre-line; }
      :root[data-theme="dark"] .push { background: rgba(30, 30, 30, 0.88); color: #eee; }
      .push .app { display: flex; gap: 6px; align-items: center; font-size: 11px; opacity: 0.75; white-space: normal; }
      .push .app span:last-child { margin-left: auto; }
      .push b { display: block; }
      .blueprint { padding: 10px 16px 12px; font-size: 13px; color: var(--secondary-text-color); }

      /* Action response */
      details { padding: 0 16px 12px; }
      summary { cursor: pointer; font-size: 14px; color: var(--brand); padding: 4px 0; }
      pre { margin: 6px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--secondary-background-color);
        font: 12px/1.5 ui-monospace, Consolas, monospace; overflow: auto; max-height: 420px; }
      table.year { width: 100%; border-collapse: collapse; font-size: 13px; }
      table.year th, table.year td { padding: 6px 16px; text-align: right; border-bottom: 1px solid var(--divider-color); }
      table.year th:first-child, table.year td:first-child { text-align: left; }
      table.year th { font-weight: 500; color: var(--secondary-text-color); }
      table.year tr.split td { border-top: 2px solid var(--divider-color); }

      /* The three cases of "PV und Speicher" */
      .cases { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
        padding: 10px 16px 6px; font-size: 13px; }
      .cases .bar { height: 14px; border-radius: 3px; background: var(--series-fixed); min-width: 2px; }
      .cases .value { text-align: right; font-variant-numeric: tabular-nums; }
      .cases .label { grid-column: 1 / -1; margin-top: 6px; }
      .cases .saving { grid-column: 1 / -1; font-size: 12px; color: var(--secondary-text-color); }
      .cases .saving b { font-weight: 500; }

      .below { margin-top: 28px; display: grid; gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
      /* The real card (custom:tarifwacht-card) */
      .cardtype { font-size: 12px; color: var(--page-muted); padding: 0 4px; }
      .cardtype code { font-size: 12px; }
      dialog#info { max-width: min(92vw, 460px); border: 1px solid var(--divider-color); border-radius: 12px;
        background: var(--card-background-color); color: var(--primary-text-color); padding: 16px 18px; }
      dialog#info::backdrop { background: rgba(0, 0, 0, 0.4); }
      dialog#info h2 { margin: 0 32px 4px 0; font-size: 16px; font-weight: 500; }
      dialog#info .state { font-size: 26px; }
      dialog#info button { position: absolute; top: 10px; right: 10px; border: 0; background: none; color: inherit;
        font-size: 18px; cursor: pointer; }
      dialog#info pre { max-height: 260px; }

      .box { border: 1px solid var(--page-line); border-radius: 10px; padding: 12px 14px; background: var(--control-bg); }
      .box h2 { margin: 0 0 6px; font-size: 14px; }
      .box p, .box li { margin: 0 0 6px; color: var(--page-muted); font-size: 14px; }
      .box ul { margin: 0; padding-left: 18px; }
      a { color: var(--brand); }
    </style>
  </head>

      <header>
        <img src="../../custom_components/tarifwacht/brand/icon.png" alt="" />
        <div>
          <h1>Tarifwacht <span data-t="demo"></span></h1>

        </div>
        <a class="repo" href="https://github.com/tarifwacht/integration">GitHub →</a>
      </header>

      <div class="controls">
        <div class="group"><span data-t="household"></span><div class="seg" id="household"></div></div>
        <div class="group"><span data-t="time"></span><div class="seg" id="time"></div></div>
        <div class="group"><span data-t="lang"></span><div class="seg" id="lang"></div></div>
        <div class="group"><span data-t="theme"></span><div class="seg" id="dark"></div></div>
      </div>

      <div class="banner" id="banner"></div>
      <main class="sections" id="dashboard"></main>

      <div class="below">
        <div class="box">
          <h2 data-t="about"></h2>
          <p data-t="data"></p>
          <p data-t="credits"></p>

          <p><a href="https://github.com/tarifwacht/integration#dashboard-tarifvergleich" data-t="readme"></a></p>
        </div>
      </div>
    </div>
    <dialog id="info" aria-labelledby="info-title"></dialog>

            `Made-up system: ${num(p.kwp, 0)} kWp, battery ${num(p.battery_kwh, 0)} kWh on a hybrid inverter, ` +
            `feed-in tariff ${ct(p.feed_in_rate)} ct/kWh, no payment at negative prices (§ 51 EEG). ` +
            "Every hour from the meters' long-term statistics, since the setup; base prices are left out.",
          solarDesc: (p) =>
            `${num(p.kwp, 0)} kWp facing south, battery ${num(p.battery_kwh, 0)} kWh / ${num(p.battery_kw, 0)} kW on a hybrid inverter ` +
            `(self-consumption first, not into the car), feed-in tariff ${ct(p.feed_in_rate)} ct/kWh, § 51 EEG`,
          yearSolarTitle: (tariff) => `Saving by PV and battery per month (${tariff})`,
        },
      };

      // State, kept in the URL so a view can be linked.
      const params = new URLSearchParams(location.search);
      const pick = (value, allowed, fallback) => (allowed.includes(value) ? value : fallback);
      const state = {
        household: pick(params.get("household"), HOUSEHOLDS, "haus"),
        time: pick(params.get("time"), MOMENTS, "winter"),
        lang: pick(params.get("lang"), ["de", "en"], navigator.language?.startsWith("de") ? "de" : "en"),
        dark: pick(params.get("dark"), ["auto", "0", "1"], "auto"),
      };
      const t = () => TEXT[state.lang];
      const saveState = () => history.replaceState(null, "", `?${new URLSearchParams(state)}`);
      const systemDark = matchMedia("(prefers-color-scheme: dark)");
      const isDark = () => (state.dark === "auto" ? systemDark.matches : state.dark === "1");

      const escapeHtml = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const icon = (name) =>
        `<svg class="mdi" viewBox="0 0 24 24" aria-hidden="true"><path d="${PATHS[name]}" /></svg>`;
      const num = (value, digits) =>
        new Intl.NumberFormat(state.lang, { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(value);
      const ct = (value) => num(value, 1);
      const eur = (value) =>
        new Intl.NumberFormat(state.lang, { style: "currency", currency: "EUR" }).format(value);
      const signedEur = (value) =>
        new Intl.NumberFormat(state.lang, { style: "currency", currency: "EUR", signDisplay: "exceptZero" }).format(value);
      const dateFmt = (iso, opts) => new Date(iso).toLocaleDateString(state.lang, { timeZone: "Europe/Berlin", ...opts });
      const timeFmt = (iso) =>
        new Date(iso).toLocaleTimeString(state.lang, { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" });

      const cache = {};
      async function load(key) {
        cache[key] ??= await (await fetch(`data/${key}.json`)).json();
        return cache[key];
      }

      // ---- Cards -------------------------------------------------------------------

      const tile = (mdi, name, value, cls = "c12") =>
        `<div class="card tile ${cls}"><div class="shape">${icon(mdi)}</div><div><b>${escapeHtml(name)}</b><small>${value}</small></div></div>`;

      function stat(name, value, cls, tone = "") {
        return `<div class="card stat ${cls}"><div class="name">${escapeHtml(name)}</div>
          <div class="value ${tone}">${num(value, 2)}<span>€</span></div></div>`;
      }

      function barChart(groups, keys, labels, height = 200, W = 640) {
        // groups: [{label, values: {key: number}}]; W is the drawing width, so
        // the text keeps about its size in a wide or narrow card.
        const H = height, L = 40, R = 8, T = 10, B = 24;
        const max = Math.max(1, ...groups.flatMap((g) => keys.map((k) => g.values[k])));
        const step = niceStep(max);
        const top = Math.ceil(max / step) * step;
        const y = (v) => T + (1 - v / top) * (H - T - B);
        const slot = (W - L - R) / groups.length;
        const bar = Math.max(1, (slot * 0.8) / keys.length);
        let svg = "";
        for (let v = 0; v <= top + 1e-9; v += step) {
          svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" />
            <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${num(v, step < 1 ? 1 : 0)}</text>`;
        }
        groups.forEach((g, i) => {
          const x0 = L + i * slot + slot * 0.1;
          keys.forEach((k, j) => {
            const v = g.values[k];
            svg += `<rect x="${x0 + j * bar}" y="${y(v)}" width="${bar * 0.92}" height="${y(0) - y(v)}" fill="${SERIES[k]}" rx="1"><title>${escapeHtml(g.title)}: ${escapeHtml(labels[k])} ${eur(v)}</title></rect>`;
          });
          if (g.label) svg += `<text x="${x0 + (bar * keys.length) / 2}" y="${H - 6}" text-anchor="middle">${g.label}</text>`;
        });
        return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${svg}</svg>`;
      }

      function niceStep(max) {
        const raw = max / 4;
        const p = 10 ** Math.floor(Math.log10(raw));
        return [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw);
      }

      function legend(keys, labels) {
        return `<div class="legend">${keys.map((k) => `<span><i style="background:${SERIES[k]}"></i>${escapeHtml(labels[k])}</span>`).join("")}</div>`;
      }

      function compareSection(data, view, keys, labels) {
        const tx = t();
        const tiles = [
          tile("trophy-outline", tx.cheapest, escapeHtml(view.cheapest)),
          ...keys.map((k) =>
            tile("tag-outline", tx.average(labels[k]), `${ct(view.tariffs[k].average_ct)} ct/kWh`, keys.length === 3 ? "c4" : "c6"),
          ),
        ];
        const width = keys.length === 3 ? "c4" : "c6";
        const stats = [
          ...keys.map((k) => stat(tx.todayOf(labels[k]), view.today[k], width)),
          ...keys.map((k) => stat(tx.monthOf(labels[k]), view.month[k], width)),
        ];
        const diffs = keys
          .filter((k) => k !== "fixed")
          .flatMap((k) => {
            const today = view.today[k] - view.today.fixed;
            const month = view.month[k] - view.month.fixed;
            const tone = (v) => (v > 0 ? "more" : v < 0 ? "less" : "");
            return [
              stat(tx.diffToday(labels[k]), today, "c6", tone(today)),
              stat(tx.diffMonth(labels[k]), month, "c6", tone(month)),
            ];
          });
        const days = view.days.map((d, i) => ({
          title: dateFmt(d.date, { day: "numeric", month: "short" }),
          label: i % 5 === 4 ? dateFmt(d.date, { day: "numeric", month: "numeric" }) : "",
          values: d.costs,
        }));
        return `
          <section class="section double">
            <div class="heading">${icon("scale-balance")}<span>${tx.compare}</span></div>
            <div class="grid">${tiles.join("")}${stats.join("")}${diffs.join("")}</div>
            <div class="subtitle">${tx.diffNote}</div>
            <div class="card"><div class="card-title">${tx.costsPerDay}</div>${barChart(days, keys, labels)}${legend(keys, labels)}</div>
          </section>`;
      }

      function curveSection(view, keys, labels) {
        const tx = t();
        const rows = view.curve;
        const W = 400, H = 240, L = 30, R = 8, T = 14, B = 22;
        const prices = rows.flatMap((r) => keys.map((k) => r.ct[k]));
        const lo = Math.min(0, Math.floor(Math.min(...prices) / 5) * 5);
        const hi = Math.ceil(Math.max(...prices) / 5) * 5;
        const kwhMax = Math.max(0.2, ...rows.map((r) => r.kwh ?? 0));
        const x = (i) => L + (i / rows.length) * (W - L - R);
        const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
        const yk = (v) => H - B - (v / kwhMax) * (H - T - B) * 0.9;
        let svg = "";
        for (let v = lo; v <= hi; v += 10) {
          svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" />
            <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
        }
        svg += `<text x="${L - 6}" y="${T - 2}" text-anchor="end">ct</text>`;
        rows.forEach((r, i) => {
          if (r.kwh) svg += `<rect x="${x(i)}" y="${yk(r.kwh)}" width="${(W - L - R) / rows.length - 0.5}" height="${H - B - yk(r.kwh)}" fill="var(--usage)" />`;
        });
        for (const k of keys) {
          let d = `M${x(0)},${y(rows[0].ct[k])}`;
          rows.forEach((r, i) => (d += `H${x(i)}V${y(r.ct[k])}`));
          d += `H${x(rows.length)}`;
          svg += `<path d="${d}" fill="none" stroke="${SERIES[k]}" stroke-width="2" />`;
        }
        for (let h = 0; h <= 24; h += 4) {
          svg += `<text x="${x(h * 4)}" y="${H - 6}" text-anchor="middle">${String(h).padStart(2, "0")}:00</text>`;
        }
        const nowIndex = rows.findIndex((r) => r.kwh === null);
        if (nowIndex > 0) {
          svg += `<line class="now" x1="${x(nowIndex)}" x2="${x(nowIndex)}" y1="${T}" y2="${H - B}" />
            <text x="${x(nowIndex) + 4}" y="${T + 10}">${tx.now}</text>`;
        }
        return `
          <section class="section">
            <div class="heading">${icon("chart-line")}<span>${tx.today}</span></div>
            <div class="card">
              <div class="card-title">${tx.todayTitle}</div>
              <svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${svg}</svg>
              <div class="legend">${keys.map((k) => `<span><i style="background:${SERIES[k]}"></i>${escapeHtml(labels[k])}</span>`).join("")}<span><i style="background:var(--usage)"></i>${tx.usage}</span></div>
              <div class="footnote">${tx.curveNote}${keys.includes("modul3") ? tx.curveModul3 : ""}</div>
            </div>
          </section>`;
      }

      function solarSection(data, view, keys, labels) {
        const tx = t();
        if (!view.solar) return "";
        const current = keys[0];
        const name = labels[current];
        const now = view.solar.sensors[current];
        const month = view.solar.month[current];
        const tone = (v) => (v > 0 ? "less" : v < 0 ? "more" : "");
        const stats = [
          stat(tx.savingOf(tx.savingPv, name), now.saving_pv, "c6", tone(now.saving_pv)),
          stat(tx.savingOf(tx.savingBattery, name), now.saving_battery, "c6", tone(now.saving_battery)),
          stat(tx.savingMonthOf(tx.savingPv, name), month.saving_pv, "c6"),
          stat(tx.savingMonthOf(tx.savingBattery, name), month.saving_battery, "c6"),
        ];
        const a = now.pv;
        const cases = [
          [tx.caseWithout, a.cost_without_pv_and_battery],
          [tx.casePv, a.cost_pv_without_battery],
          [tx.caseActual, a.cost_actual],
        ];
        const top = Math.max(1, ...cases.map((c) => c[1]));
        const bar = (value) => `<div class="bar" style="width:${Math.max(0, (value / top) * 100)}%"></div>`;
        const saving = (label, value) => `<div class="saving">↳ ${tx.caseSaving(escapeHtml(label), eur(value))}</div>`;
        const casesHtml = cases
          .map(
            ([label, value], i) =>
              `<span class="label">${escapeHtml(label)}</span>${bar(value)}<span class="value">${eur(value)}</span>` +
              (i === 0 ? saving(tx.savingPv, now.saving_pv) : i === 1 ? saving(tx.savingBattery, now.saving_battery) : ""),
          )
          .join("");
        const row = (mdi, label, value, note = "") =>
          `<div class="row">${icon(mdi)}<span>${escapeHtml(label)}${note ? `<small>${note}</small>` : ""}</span><span class="value">${value}</span></div>`;
        const kwh = (v) => `${num(v, 0)} kWh`;
        const b = now.battery;
        const value = b.value_per_kwh_ct === null ? "" : `${ct(b.value_per_kwh_ct)} ct ${tx.perKwh} (${escapeHtml(name)})`;
        const energy = `
          <div class="rows">
            ${row("lightning-bolt", tx.consumption, kwh(a.consumption_kwh))}
            ${row("solar-power-variant", tx.pvEnergy, kwh(a.pv_kwh))}
            ${row("transmission-tower-import", tx.energy, kwh(a.purchase_kwh))}
            ${row("transmission-tower-export", tx.feedIn, kwh(a.feed_in_kwh), tx.unpaid(num(a.feed_in_unpaid_kwh, 0)))}
            ${row("home-battery", tx.discharged, kwh(b.discharged_kwh), value)}
          </div>`;
        const table = `<table class="year"><tr><th></th><th>${tx.savingPv}</th><th>${tx.savingBattery}</th><th>${tx.together}</th></tr>
          ${keys
            .map((k) => {
              const v = view.solar.sensors[k];
              return `<tr><td>${escapeHtml(labels[k])}</td><td>${eur(v.saving_pv)}</td><td>${eur(v.saving_battery)}</td><td>${eur(v.saving_pv + v.saving_battery)}</td></tr>`;
            })
            .join("")}</table>`;
        return `
          <section class="section">
            <div class="heading">${icon("solar-power-variant")}<span>${tx.solar}</span></div>
            <div class="grid">${stats.join("")}</div>
            <div class="card"><div class="card-title">${tx.casesTitle(name)}</div><div class="cases">${casesHtml}</div>${energy}</div>
            <div class="card"><div class="card-title">${tx.perTariff}</div>${table}<div class="footnote" style="padding-top:8px">${tx.solarNote(data.pv_system)}</div></div>
          </section>`;
      }

      function devicesSection(data, view, keys, labels) {
        const tx = t();
        const since = tx.since(dateFmt(data.setup, { day: "numeric", month: "long", year: "numeric" }));
        const row = (mdi, name, value, note = "") =>
          `<div class="row">${icon(mdi)}<span>${escapeHtml(name)}${note ? `<small>${note}</small>` : ""}</span><span class="value">${value}</span></div>`;
        const ranking = view.ranking.map((r) => `${escapeHtml(r.tariff)}: ${eur(r.cost)}`).join(" · ");
        const solar = view.solar?.sensors;
        const meter = `
          <div class="card"><div class="device">${escapeHtml(tx.meter(data.device))}</div><div class="rows">
            ${row("transmission-tower-import", tx.energy, `${num(view.energy_kwh, 2)} kWh`, since)}
            ${row("trophy-outline", tx.cheapest, escapeHtml(view.cheapest), ranking)}
          </div></div>`;
        const tariffs = keys
          .map((k) => {
            const v = view.tariffs[k];
            return `
              <div class="card"><div class="device">${escapeHtml(data.device)} ${escapeHtml(labels[k])}${k === "fixed" ? ` · ${tx.current}` : ""}</div><div class="rows">
                ${row("cash", tx.consumptionCost, eur(v.consumption_cost))}
                ${row("cash-multiple", tx.cost, eur(v.cost))}
                ${row("tag-outline", tx.averagePrice, `${ct(v.average_ct)} ct/kWh`)}
                ${v.difference === null ? "" : row("plus-minus-variant", tx.difference, signedEur(v.difference))}
                ${solar ? row("solar-power-variant", tx.savingPv, eur(solar[k].saving_pv)) : ""}
                ${solar ? row("home-battery", tx.savingBattery, eur(solar[k].saving_battery), solar[k].battery.value_per_kwh_ct === null ? "" : `${ct(solar[k].battery.value_per_kwh_ct)} ct ${tx.perKwh}`) : ""}
              </div></div>`;
          })
          .join("");
        return `
          <section class="section">
            <div class="heading">${icon("lightning-bolt")}<span>${tx.devices}</span></div>
            ${meter}${tariffs}
          </section>`;
      }

      function notificationSection(view) {
        const tx = t();
        const n = view.notification;
        const when = dateFmt(n.at, { day: "numeric", month: "short" }) + ", " + timeFmt(n.at);
        return `
          <section class="section">
            <div class="heading">${icon("bell-ring-outline")}<span>${tx.notification}</span></div>
            <div class="card">
              <div class="phone"><div class="push"><div class="app">${icon("bell-ring-outline")}<span>Home Assistant</span><span>${when}</span></div><b>${escapeHtml(n.title)}</b>${escapeHtml(n.message)}</div></div>
              <div class="blueprint">${tx.notificationNote}<br /><a href="${BLUEPRINT_URL}" target="_blank" rel="noopener">${tx.importBlueprint}</a></div>
            </div>
          </section>`;
      }

      function yaml(value, indent = "") {
        if (Array.isArray(value)) {
          return value
            .map((item) => {
              const body = yaml(item, indent + "  ");
              return typeof item === "object" && item ? `\n${indent}- ${body.trimStart()}` : `\n${indent}- ${body}`;
            })
            .join("");
        }
        if (value && typeof value === "object") {
          return Object.entries(value)
            .map(([k, v]) => {
              const inner = yaml(v, indent + "  ");
              return typeof v === "object" && v !== null ? `\n${indent}${k}:${inner}` : `\n${indent}${k}: ${inner}`;
            })
            .join("");
        }
        if (value === null) return "null";
        return typeof value === "string" ? value : String(value);
      }

      function yearSection(data, keys, labels) {
        const tx = t();
        const year = data.year;
        const groups = year.months.map((m) => {
          const values = {};
          for (const row of m.tariffs) values[keys.find((k) => labels[k] === row.tariff)] = row.cost;
          return { title: m.month, label: dateFmt(`${m.month}-15`, { month: "short" }), values };
        });
        const head = `<tr><th></th>${keys.map((k) => `<th>${escapeHtml(labels[k])}</th>`).join("")}</tr>`;
        const totals = Object.fromEntries(year.tariffs.map((r) => [r.tariff, r]));
        const line = (name, fn) => `<tr><td>${name}</td>${keys.map((k) => `<td>${fn(totals[labels[k]])}</td>`).join("")}</tr>`;
        const pv = year.pv_battery;
        const savings = pv ? Object.fromEntries(pv.tariffs.map((r) => [r.tariff, r])) : {};
        const solarLine = (name, fn, cls = "") =>
          `<tr class="${cls}"><td>${name}</td>${keys.map((k) => `<td>${fn(savings[labels[k]])}</td>`).join("")}</tr>`;
        const solarLines = pv
          ? solarLine(tx.savingPv, (r) => eur(r.saving_pv), "split") + solarLine(tx.savingBattery, (r) => eur(r.saving_battery))
          : "";
        let solarChart = "";
        if (pv) {
          const name = labels[keys[0]];
          const months = pv.months.map((m) => {
            const r = m.tariffs.find((x) => x.tariff === name);
            return {
              title: m.month,
              label: dateFmt(`${m.month}-15`, { month: "short" }),
              values: { pv: Math.max(0, r.saving_pv), battery: Math.max(0, r.saving_battery) },
            };
          });
          const parts = { pv: tx.savingPv, battery: tx.savingBattery };
          solarChart = `<div class="card"><div class="card-title">${tx.yearSolarTitle(name)}</div>
            ${barChart(months, ["pv", "battery"], parts, 220, 1240)}${legend(["pv", "battery"], parts)}</div>`;
        }
        const table = `<table class="year">${head}
          ${line(tx.total, (r) => eur(r.cost))}
          ${line(tx.averagePrice, (r) => `${ct(r.average_price_ct)} ct/kWh`)}
          ${line(tx.difference, (r) => (r.current ? "–" : signedEur(r.difference_to_current)))}
          ${solarLines}</table>`;
        return `
          <section class="section wide">
            <div class="heading">${icon("calendar-month-outline")}<span>${tx.year}</span></div>
            <div class="card">
              <div class="card-title">${tx.yearTitle}</div>
              ${barChart(groups, keys, labels, 280, 1240)}${legend(keys, labels)}
              ${table}
              <details><summary>${tx.response}</summary><pre>${escapeHtml(yaml(year).trimStart())}</pre></details>
            </div>
            ${solarChart}
          </section>`;
      }

      // ---- The real card on a made-up Home Assistant ------------------------------------
      // What the card uses of Home Assistant: the entity registry, states, two
      // websocket commands of the recorder, Tarifwacht's own one, ha-card and ha-icon.

      if (!customElements.get("ha-card")) {
        customElements.define("ha-card", class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: "open" }).innerHTML =
              "<style>:host{display:block;background:var(--card-background-color);border:1px solid var(--divider-color);" +
              "border-radius:12px;color:var(--primary-text-color)}</style><slot></slot>";
          }
        });
      }
      if (!customElements.get("ha-icon")) {
        customElements.define("ha-icon", class extends HTMLElement {
          connectedCallback() {
            const path = PATHS[(this.getAttribute("icon") || "").replace("mdi:", "")] ?? "";
            this.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true" style="display:inline-block;width:var(--mdc-icon-size,24px);` +
              `height:var(--mdc-icon-size,24px);fill:currentColor"><path d="${path}"/></svg>`;
          }
        });
      }

      // Entity id slugs of the sensors (German entity names, as Home Assistant makes them).
      const SENSOR_SLUGS = {
        cost: "kosten_gesamt",
        consumption_cost: "verbrauchskosten",
        average_price: "durchschnittspreis",
        difference: "differenz_zum_aktuellen_tarif",
        saving_pv: "ersparnis_pv",
        saving_battery: "ersparnis_speicher",
      };
      let demo; // the made-up hass of the view shown

      /** A made-up hass for this household and moment: Tarifwacht's sensors with
       * their states, and what the recorder answers the card at that moment. */
      function demoHass(data, view, household) {
        const tx = t();
        const entities = {};
        const states = {};
        const stats = {}; // entity id -> [statistic key, tariff key]
        const add = (id, key, value, attributes) => {
          entities[id] = { entity_id: id, platform: "tarifwacht", translation_key: key, device_id: household };
          states[id] = { entity_id: id, state: value === null || value === undefined ? "unknown" : String(value), attributes };
        };
        const current = data.tariffs.find((x) => x.current);
        const cheapest = `sensor.${household}_gunstigster_tarif`;
        add(cheapest, "cheapest", view.cheapest, {
          friendly_name: `${data.device} ${tx.cheapest}`,
          current: current?.title ?? null,
          ranking: view.ranking,
        });
        const energy = `sensor.${household}_strombezug`;
        add(energy, "energy", view.energy_kwh, { friendly_name: `${data.device} ${tx.energy}`, unit_of_measurement: "kWh" });
        const solar = view.solar?.sensors;
        const names = {
          cost: tx.cost, consumption_cost: tx.consumptionCost, average_price: tx.averagePrice,
          difference: tx.difference, saving_pv: tx.savingPv, saving_battery: tx.savingBattery,
        };
        const tariffs = data.tariffs.map((tariff) => {
          const v = view.tariffs[tariff.key];
          const values = {
            cost: v.cost, consumption_cost: v.consumption_cost, average_price: v.average_ct,
            ...(v.difference === null ? {} : { difference: v.difference }),
            ...(solar ? { saving_pv: solar[tariff.key].saving_pv, saving_battery: solar[tariff.key].saving_battery } : {}),
          };
          const ids = {};
          for (const [key, value] of Object.entries(values)) {
            const id = `sensor.${household}_${tariff.slug}_${SENSOR_SLUGS[key]}`;
            ids[key] = id;
            stats[id] = [key, tariff.key];
            add(id, key, value, {
              friendly_name: `${data.device} ${tariff.title} ${names[key]}`,
              unit_of_measurement: key === "average_price" ? "ct/kWh" : "€",
            });
          }
          return { key: tariff.key, title: tariff.title, current: Boolean(tariff.current), entities: ids };
        });
        // The answer of "tarifwacht/tariffs" (cards.py).
        const info = {
          title: data.device,
          cheapest,
          energy,
          current: current?.key ?? null,
          solar: Boolean(solar),
          battery: Boolean(solar),
          tariffs,
        };
        const statistic = (id, values) => {
          const [key, tariff] = stats[id] ?? [];
          const value = values?.[key]?.[tariff];
          return typeof value === "number" ? value : null;
        };
        return {
          entities,
          states,
          connection: {}, // a new one per view: the card keeps no statistics of another moment
          language: state.lang,
          locale: { language: state.lang, number_format: "language", time_format: "24", time_zone: "server" },
          config: { time_zone: "Europe/Berlin" },
          callWS: async (message) => {
            if (message.type === "tarifwacht/tariffs") {
              if (!entities[message.entity_id]) throw { code: "not_found", message: "No Tarifwacht entry" };
              return info;
            }
            if (message.type === "recorder/statistic_during_period") {
              return { change: statistic(message.statistic_id, view.card.periods[message.calendar.period]) };
            }
            if (message.type === "recorder/statistics_during_period") {
              const rows = {};
              for (const id of message.statistic_ids) {
                rows[id] = view.card.months.map((m) => ({
                  start: new Date(`${m.month}-01T00:00:00${offset(m.month)}`).getTime(),
                  change: statistic(id, m),
                }));
              }
              return rows;
            }
            throw new Error(`not in the demo: ${message.type}`);
          },
        };
      }

      /** UTC offset of Berlin at the start of a month ("+01:00" or "+02:00"). */
      function offset(month) {
        const m = Number(month.split("-")[1]);
        return m > 3 && m < 11 ? "+02:00" : "+01:00"; // whole months: April to October
      }

      function cardSection() {
        return `<section class="section double"><div data-card></div>
          <div class="cardtype"><code>type: custom:tarifwacht-card</code></div></section>`;
      }

      // The card's clock runs from the moment of the view (its last twelve
      // months and the current calendar year count from "now"); the page
      // itself does not use Date.now.
      const REAL_NOW = Date.now;
      function mountCard(data, view) {
        const shift = new Date(view.now).getTime() - REAL_NOW();
        Date.now = () => REAL_NOW() + shift;
        demo = demoHass(data, view, state.household);
        const slot = document.querySelector("[data-card]");
        const card = document.createElement("tarifwacht-card");
        card.setConfig({ type: "custom:tarifwacht-card", entity: `sensor.${state.household}_gunstigster_tarif` });
        card.hass = demo;
        slot.replaceWith(card);
      }

      // A click in the card opens the details, as in Home Assistant.
      document.addEventListener("hass-more-info", (event) => {
        const s = demo?.states[event.detail.entityId];
        if (!s) return;
        const tx = t();
        const { friendly_name: title, unit_of_measurement: unit, ...attributes } = s.attributes;
        const value = Number(s.state);
        const shown = Number.isNaN(value) ? s.state
          : unit === "€" ? eur(value) : `${num(value, unit === "kWh" ? 2 : 1)} ${unit ?? ""}`;
        const dialog = document.getElementById("info");
        dialog.innerHTML = `<button type="button" aria-label="${escapeHtml(tx.close)}">✕</button>
          <h2 id="info-title">${escapeHtml(title ?? s.entity_id)}</h2><div class="state">${escapeHtml(shown)}</div>
          <div class="cardtype"><code>${escapeHtml(s.entity_id)}</code></div>
          ${Object.keys(attributes).length ? `<pre>${escapeHtml(yaml(attributes).trimStart())}</pre>` : ""}`;
        dialog.querySelector("button").addEventListener("click", () => dialog.close());
        dialog.showModal();
      });
      document.getElementById("info").addEventListener("click", (event) => {
        if (event.target === event.currentTarget) event.currentTarget.close();
      });

      // ---- Page ----------------------------------------------------------------------

      async function render() {
        const tx = t();
        const data = await load(state.household);
        const view = data.moments[state.time];
        const keys = data.tariffs.map((x) => x.key);
        const labels = Object.fromEntries(data.tariffs.map((x) => [x.key, x.title]));
        const clock = new Date(view.now).toLocaleString(state.lang, {
          timeZone: "Europe/Berlin",
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
        document.getElementById("banner").innerHTML = `${icon("information-outline")}<span>${tx.banner(clock)}</span>`;
        document.getElementById("dashboard").innerHTML =
          cardSection() +
          curveSection(view, keys, labels) +
          compareSection(data, view, keys, labels) +
          solarSection(data, view, keys, labels) +
          devicesSection(data, view, keys, labels) +
          notificationSection(view) +
          yearSection(data, keys, labels);
        mountCard(data, view);
        document.getElementById("tariff-list").innerHTML = data.tariffs
          .map((d) => {
            const text = d.kind === "fixed" ? tx.fixedDesc(d) : tx.dynamicDesc(d) + (d.modul3 ? `; ${tx.modul3Desc(d.modul3)}` : "");
            return `<li><b>${escapeHtml(d.title)}${d.current ? ` (${tx.current})` : ""}:</b> ${escapeHtml(text)}</li>`;
          })
          .join("") +
          (data.pv_system ? `<li><b>${tx.solar}:</b> ${escapeHtml(tx.solarDesc(data.pv_system))}</li>` : "");
      }

      function applyTheme() {
        document.documentElement.dataset.theme = isDark() ? "dark" : "light";
      }

      function applyText() {
        const tx = t();
        document.documentElement.lang = state.lang;
        for (const el of document.querySelectorAll("[data-t]")) el.textContent = tx[el.dataset.t];
        segment("household", HOUSEHOLDS, (v) => tx.households[v], render);
        segment("time", MOMENTS, (v) => tx.moments[v], render);
        segment("lang", ["de", "en"], (v) => v.toUpperCase(), () => (applyText(), render()));
        segment("dark", ["auto", "0", "1"], (v) => tx[{ auto: "auto", 0: "light", 1: "dark" }[v]], applyTheme);
      }

      function segment(id, values, label, onChange) {
        const box = document.getElementById(id);
        box.replaceChildren(
          ...values.map((value) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label(value);
            button.setAttribute("aria-pressed", String(state[id] === value));
            button.addEventListener("click", () => {
              if (state[id] === value) return;
              state[id] = value;
              for (const b of box.children) b.setAttribute("aria-pressed", String(b === button));
              saveState();
              onChange();
            });
            return button;
          }),
        );
      }

      systemDark.addEventListener("change", () => state.dark === "auto" && applyTheme());
      applyText();
      applyTheme();
      saveState();
      await render();
    </script>
  </body>
</html>
