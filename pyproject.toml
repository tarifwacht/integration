[project]
name = "tarifwacht"
# Kept equal to custom_components/tarifwacht/manifest.json (checked by tests/test_manifest.py).
version = "0.1.0.dev0"
description = "Home Assistant integration: compare grid purchase costs under fixed and dynamic electricity tariffs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"

[dependency-groups]
# Local development (works on Windows): imports Home Assistant, runs logic tests.
dev = [
    "homeassistant==2026.10.2",
    "pytest",
    "pytest-asyncio",
    "ruff",
    # Windows ships no IANA time zone database; zoneinfo needs it for Europe/Berlin.
    "tzdata; sys_platform == 'win32'",
]
# Home Assistant test harness. Linux only (needs fcntl), installed in CI.
# Its version must pin the same homeassistant version as the dev group.
ha-tests = [
    "pytest-homeassistant-custom-component==0.13.373",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The cache provider leaves undeletable temp dirs on the network drive.
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py314"
extend-exclude = ["*.md"]
# Keep the cache off the network drive (permission errors there).
cache-dir = "~/.cache/ruff"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "DTZ"]
# E501: line length is handled by the formatter.
# RUF001/RUF003: German texts legitimately use typographic dashes.
ignore = ["E501", "RUF001", "RUF003"]
